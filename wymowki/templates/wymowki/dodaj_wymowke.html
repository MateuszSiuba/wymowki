{% extends 'wymowki/base.html' %}

{% block title %}Dodaj Wymówkę - Generator Wymówek{% endblock %}

{% block content %}
<div class="form-container">
    <h1>Dodaj nową wymówkę</h1>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="przycisk">Dodaj!</button>
    </form>

    <a href="{% url 'strona_glowna' %}" class="link-powrotny">Wróć do generatora</a>
</div>
{% endblock %}
